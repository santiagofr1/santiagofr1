<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="rtop · santiagofr1: embedded firmware, rtop, Vynote and claude-mods">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82aaff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#2d3240"/>
      <stop offset="1" stop-color="#c88cff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bars">
      <rect x="120" y="63" width="225" height="14" rx="3"/>
      <rect x="120" y="89" width="185" height="14" rx="3"/>
      <rect x="120" y="115" width="150" height="14" rx="3"/>
    </clipPath>
    <clipPath id="scope"><rect x="601" y="57" width="234" height="76" rx="4"/></clipPath>
    <clipPath id="typed">
      <rect x="20" y="12" width="230" height="28">
        <animate attributeName="width" from="0" to="230" dur="1.2s" fill="freeze" calcMode="discrete"
                 values="0;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144;153;162;171;180;189;198;207;216;230"/>
      </rect>
    </clipPath>
    <pattern id="grid" width="19.5" height="19" patternUnits="userSpaceOnUse" x="601" y="57">
      <path d="M19.5 0H0V19" fill="none" stroke="#232733" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #e1e4eb; }
    .dim { fill: #6e7382; } .acc { fill: #82aaff; font-weight: 700; } .ok { fill: #78dc8c; }
    .warn { fill: #f0c85a; } .hd { fill: #6e7382; font-size: 12px; letter-spacing: .04em; } .sm { font-size: 11px; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="858" height="338" rx="12" fill="#16181e" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- typed command -->
  <g clip-path="url(#typed)">
    <text x="24" y="31"><tspan class="ok">$</tspan> rtop --user <tspan class="acc">santiagofr1</tspan></text>
  </g>
  <text x="836" y="31" text-anchor="end" class="dim"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.706;1" dur="1.7s" fill="freeze"/>Computer Engineering · UNLPam</text>
  <line x1="1" y1="44" x2="859" y2="44" stroke="#2d3240"/>

  <!-- gauges -->
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.722;1" dur="1.8s" fill="freeze"/>
    <text x="24" y="74" class="dim">embedded</text>
    <rect x="120" y="63" width="250" height="14" rx="3" fill="#1e212a"/>
    <rect x="120" y="63" width="225" height="14" rx="3" fill="#78dc8c"><animate attributeName="width" values="0;0;225" keyTimes="0;0.538;1" dur="2.6s" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1" fill="freeze"/></rect>
    <text x="380" y="74" class="dim">C · ESP-IDF · STM32</text>

    <text x="24" y="100" class="dim">software</text>
    <rect x="120" y="89" width="250" height="14" rx="3" fill="#1e212a"/>
    <rect x="120" y="89" width="185" height="14" rx="3" fill="#82aaff"><animate attributeName="width" values="0;0;185" keyTimes="0;0.564;1" dur="2.75s" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1" fill="freeze"/></rect>
    <text x="380" y="100" class="dim">Rust · Flutter · TS</text>

    <text x="24" y="126" class="dim">hardware</text>
    <rect x="120" y="115" width="250" height="14" rx="3" fill="#1e212a"/>
    <rect x="120" y="115" width="150" height="14" rx="3" fill="#c88cff"><animate attributeName="width" values="0;0;150" keyTimes="0;0.586;1" dur="2.9s" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1" fill="freeze"/></rect>
    <text x="380" y="126" class="dim">KiCad · 4G · MQTT</text>

    <!-- shine sweeping the bars -->
    <g clip-path="url(#bars)">
      <rect x="40" y="60" width="70" height="72" fill="url(#shine)">
        <animate attributeName="x" values="40;40;360" keyTimes="0;.55;1" dur="4s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- oscilloscope -->
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="2s" fill="freeze"/>
    <rect x="601" y="57" width="234" height="76" rx="4" fill="#12141a" stroke="#2d3240"/>
    <rect x="601" y="57" width="234" height="76" fill="url(#grid)" clip-path="url(#scope)"/>
    <g clip-path="url(#scope)">
      <!-- UART: square wave -->
      <path fill="none" stroke="#f0c85a" stroke-width="1.6"
            d="M560 90 h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-84 0" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <!-- analog signal -->
      <path fill="none" stroke="#82aaff" stroke-width="1.6"
            d="M560 113 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="608" y="69" class="dim sm">UART 115200</text>
    <text x="829" y="69" class="dim sm" text-anchor="end">ADC</text>
  </g>

  <!-- process table -->
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.792;1" dur="2.4s" fill="freeze"/>
    <rect x="1" y="148" width="858" height="26" fill="#1e212a"/>
    <text x="24"  y="166" class="hd">PID</text>
    <text x="80"  y="166" class="hd">PROCESS</text>
    <text x="250" y="166" class="hd">WHAT IT DOES</text>
    <text x="660" y="166" class="hd">STATUS</text>
  </g>

  <!-- cursor moving down the rows -->
  <rect x="1" y="178" width="858" height="26" fill="#2d3750">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.9;1" dur="2.9s" fill="freeze"/>
    <animate attributeName="y" values="178;206;234;262;234;206" calcMode="discrete" begin="3.2s" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" dur="2.5s" fill="freeze"/>
    <text x="24" y="196" class="dim">1</text><text x="80" y="196" class="ok">firmware</text>
    <text x="250" y="196">embedded firmware for microcontrollers</text>
    <circle cx="664" cy="191" r="4" fill="#78dc8c"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle><text x="676" y="196" class="ok">running</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.811;1" dur="2.65s" fill="freeze"/>
    <text x="24" y="224" class="dim">2</text><text x="80" y="224" class="acc">rtop</text>
    <text x="250" y="224">system monitor for Linux</text>
    <circle cx="664" cy="219" r="4" fill="#78dc8c"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin=".3s" repeatCount="indefinite"/></circle><text x="676" y="224" class="ok">running</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.821;1" dur="2.8s" fill="freeze"/>
    <text x="24" y="252" class="dim">3</text><text x="80" y="252" class="acc">vynote</text>
    <text x="250" y="252">handwritten notes for Android</text>
    <circle cx="664" cy="247" r="4" fill="#78dc8c"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin=".6s" repeatCount="indefinite"/></circle><text x="676" y="252" class="ok">running</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.831;1" dur="2.95s" fill="freeze"/>
    <text x="24" y="280" class="dim">4</text><text x="80" y="280" class="acc">claude-mods</text>
    <text x="250" y="280">mods for Claude Code</text>
    <circle cx="664" cy="275" r="4" fill="#78dc8c"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin=".9s" repeatCount="indefinite"/></circle><text x="676" y="280" class="ok">running</text>
  </g>

  <!-- footer -->
  <line x1="1" y1="302" x2="859" y2="302" stroke="#2d3240"/>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.844;1" dur="3.2s" fill="freeze"/>
    <text x="24" y="325"><tspan class="warn">PR</tspan><tspan class="dim"> welcome   </tspan><tspan class="warn">issue</tspan><tspan class="dim"> if something breaks   </tspan><tspan class="warn">fork</tspan><tspan class="dim"> no permission needed</tspan></text>
    <text x="836" y="325" text-anchor="end" class="dim">$ <tspan style="fill:#e1e4eb">▌<animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
