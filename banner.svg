<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="rtop · santiagofr1: firmware IoT, rtop, OpenNote y claude-mods">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82aaff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#2d3240"/>
      <stop offset="1" stop-color="#c88cff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bars">
      <rect x="120" y="63" width="225" height="14" rx="3"/>
      <rect x="120" y="89" width="185" height="14" rx="3"/>
      <rect x="120" y="115" width="150" height="14" rx="3"/>
    </clipPath>
    <clipPath id="scope"><rect x="601" y="57" width="234" height="76" rx="4"/></clipPath>
    <clipPath id="typed">
      <rect x="20" y="12" width="0" height="28">
        <animate attributeName="width" from="0" to="230" dur="1.2s" fill="freeze" calcMode="discrete"
                 values="0;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144;153;162;171;180;189;198;207;216;230"/>
      </rect>
    </clipPath>
    <pattern id="grid" width="19.5" height="19" patternUnits="userSpaceOnUse" x="601" y="57">
      <path d="M19.5 0H0V19" fill="none" stroke="#232733" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #e1e4eb; }
    .dim { fill: #6e7382; } .acc { fill: #82aaff; font-weight: 700; } .ok { fill: #78dc8c; }
    .warn { fill: #f0c85a; } .hd { fill: #6e7382; font-size: 12px; letter-spacing: .04em; } .sm { font-size: 11px; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .in { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  </style>

  <!-- ventana -->
  <rect x="1" y="1" width="858" height="338" rx="12" fill="#16181e" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- comando que se escribe -->
  <g clip-path="url(#typed)">
    <text x="24" y="31"><tspan class="ok">$</tspan> rtop --user <tspan class="acc">santiagofr1</tspan></text>
  </g>
  <text x="836" y="31" text-anchor="end" class="dim in" style="animation-delay:1.2s">Ing. en Computación · UNLPam</text>
  <line x1="1" y1="44" x2="859" y2="44" stroke="#2d3240"/>

  <!-- medidores -->
  <g class="in" style="animation-delay:1.3s">
    <text x="24" y="74" class="dim">embebidos</text>
    <rect x="120" y="63" width="250" height="14" rx="3" fill="#1e212a"/>
    <rect class="bar" x="120" y="63" width="225" height="14" rx="3" fill="#78dc8c" style="animation-delay:1.4s"/>
    <text x="380" y="74" class="dim">C · ESP-IDF · STM32</text>

    <text x="24" y="100" class="dim">software</text>
    <rect x="120" y="89" width="250" height="14" rx="3" fill="#1e212a"/>
    <rect class="bar" x="120" y="89" width="185" height="14" rx="3" fill="#82aaff" style="animation-delay:1.55s"/>
    <text x="380" y="100" class="dim">Rust · Flutter · TS</text>

    <text x="24" y="126" class="dim">hardware</text>
    <rect x="120" y="115" width="250" height="14" rx="3" fill="#1e212a"/>
    <rect class="bar" x="120" y="115" width="150" height="14" rx="3" fill="#c88cff" style="animation-delay:1.7s"/>
    <text x="380" y="126" class="dim">KiCad · 4G · MQTT</text>

    <!-- brillo que recorre las barras -->
    <g clip-path="url(#bars)">
      <rect x="40" y="60" width="70" height="72" fill="url(#shine)">
        <animate attributeName="x" values="40;40;360" keyTimes="0;.55;1" dur="4s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- osciloscopio -->
  <g class="in" style="animation-delay:1.5s">
    <rect x="601" y="57" width="234" height="76" rx="4" fill="#12141a" stroke="#2d3240"/>
    <rect x="601" y="57" width="234" height="76" fill="url(#grid)" clip-path="url(#scope)"/>
    <g clip-path="url(#scope)">
      <!-- UART: onda cuadrada -->
      <path fill="none" stroke="#f0c85a" stroke-width="1.6"
            d="M560 90 h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14
               h12 v-14 h12 v14 h6 v-14 h18 v14 h12 v-14 h6 v14 h12 v-14 h6 v14">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-84 0" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <!-- señal analógica -->
      <path fill="none" stroke="#82aaff" stroke-width="1.6"
            d="M560 113 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="608" y="69" class="dim sm">UART 115200</text>
    <text x="829" y="69" class="dim sm" text-anchor="end">ADC</text>
  </g>

  <!-- tabla de procesos -->
  <g class="in" style="animation-delay:1.9s">
    <rect x="1" y="148" width="858" height="26" fill="#1e212a"/>
    <text x="24"  y="166" class="hd">PID</text>
    <text x="80"  y="166" class="hd">PROCESO</text>
    <text x="250" y="166" class="hd">QUÉ HACE</text>
    <text x="660" y="166" class="hd">ESTADO</text>
  </g>

  <!-- cursor que baja por las filas -->
  <rect x="1" y="178" width="858" height="26" fill="#2d3750" opacity="0">
    <animate attributeName="opacity" to="1" begin="2.6s" dur=".3s" fill="freeze"/>
    <animate attributeName="y" values="178;206;234;262;234;206" calcMode="discrete" begin="3.2s" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g class="in" style="animation-delay:2.0s">
    <text x="24" y="196" class="dim">1</text><text x="80" y="196" class="ok">firmware-iot</text>
    <text x="250" y="196">equipos IoT industriales (trabajo)</text>
    <circle class="pulse" cx="664" cy="191" r="4" fill="#78dc8c"/><text x="676" y="196" class="ok">corriendo</text>
  </g>
  <g class="in" style="animation-delay:2.15s">
    <text x="24" y="224" class="dim">2</text><text x="80" y="224" class="acc">rtop</text>
    <text x="250" y="224">monitor del sistema para Linux</text>
    <circle class="pulse" cx="664" cy="219" r="4" fill="#78dc8c" style="animation-delay:.3s"/><text x="676" y="224" class="ok">corriendo</text>
  </g>
  <g class="in" style="animation-delay:2.3s">
    <text x="24" y="252" class="dim">3</text><text x="80" y="252" class="acc">opennote</text>
    <text x="250" y="252">apuntes a mano para Android</text>
    <circle class="pulse" cx="664" cy="247" r="4" fill="#78dc8c" style="animation-delay:.6s"/><text x="676" y="252" class="ok">corriendo</text>
  </g>
  <g class="in" style="animation-delay:2.45s">
    <text x="24" y="280" class="dim">4</text><text x="80" y="280" class="acc">claude-mods</text>
    <text x="250" y="280">mods para Claude Code</text>
    <circle class="pulse" cx="664" cy="275" r="4" fill="#78dc8c" style="animation-delay:.9s"/><text x="676" y="280" class="ok">corriendo</text>
  </g>

  <!-- pie -->
  <line x1="1" y1="302" x2="859" y2="302" stroke="#2d3240"/>
  <g class="in" style="animation-delay:2.7s">
    <text x="24" y="325"><tspan class="warn">PR</tspan><tspan class="dim"> bienvenidos   </tspan><tspan class="warn">issue</tspan><tspan class="dim"> si algo falla   </tspan><tspan class="warn">fork</tspan><tspan class="dim"> sin pedir permiso</tspan></text>
    <text x="836" y="325" text-anchor="end" class="dim">$ <tspan class="cur" style="fill:#e1e4eb">▌</tspan></text>
  </g>
</svg>
